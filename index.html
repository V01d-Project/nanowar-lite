<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>细胞战争 Lite</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#cfd6e4;font-size:14px;pointer-events:none;z-index:5}
  .hud b{font-size:17px}
  .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
    display:flex;gap:10px;justify-content:center;z-index:5}
  button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);
    color:#e6ebf5;font-size:15px;padding:10px 18px;border-radius:12px}
  button:active{transform:scale(.97)}
  #msg{position:fixed;inset:0;display:none;place-items:center;background:rgba(6,10,18,.78);z-index:9;color:#f1f5fb}
  #msg .card{text-align:center;padding:28px 34px;border-radius:18px;background:#121a2b;border:1px solid rgba(255,255,255,.1)}
  #msg h1{margin:0 0 8px;font-size:26px}
  #msg p{margin:0 0 18px;color:#9aa6bd;font-size:14px}
  .hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);text-align:center;
    color:#7b869c;font-size:12px;pointer-events:none;z-index:4;transition:opacity .5s;line-height:1.6}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="hud">
  <div class="pill">你 <b id="pCount">0</b></div>
  <div class="pill" id="tip">圈选 · 派兵</div>
  <div class="pill">AI <b id="eCount">0</b></div>
</div>
<div class="bottom">
  <button id="restart">重开</button>
  <button id="speed">速度 x1</button>
</div>
<div class="hint" id="hint">圈选自己的细胞 → 点目标出兵 50%<br>脂肪细胞（圈）罩住敌人，抗体细胞（星）感染敌人</div>
<div id="msg"><div class="card"><h1 id="mtitle"></h1><p id="msub"></p><button id="again">再来一局</button></div></div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, speedMul = 1;

  // 类型：n 普通 · f 脂肪 · a 抗体
  const MAP = [
    { x:0.16, y:0.80, own:1, u:40, type:'n', r:0.070 },
    { x:0.30, y:0.90, own:1, u:20, type:'n', r:0.055 },
    { x:0.84, y:0.20, own:2, u:40, type:'n', r:0.070 },
    { x:0.70, y:0.10, own:2, u:20, type:'n', r:0.055 },
    { x:0.50, y:0.50, own:0, u:30, type:'n', r:0.075 },
    { x:0.34, y:0.58, own:0, u:16, type:'n', r:0.050 },
    { x:0.66, y:0.42, own:0, u:16, type:'n', r:0.050 },
    { x:0.50, y:0.30, own:0, u:0,  type:'f', r:0.048 },
    { x:0.50, y:0.70, own:0, u:0,  type:'a', r:0.048 },
    { x:0.22, y:0.34, own:0, u:12, type:'n', r:0.042 },
    { x:0.78, y:0.66, own:0, u:12, type:'n', r:0.042 }
  ];

  let cells = [], units = [], selected = new Set();
  let drag = null, over = 0, aiTimer = 0;

  const TRAVEL = 107;        // px/s（原版节奏）
  const POWER_MAX = 100;
  const FAT_LOAD = 8;        // 240 帧 @30fps
  const AB_LOAD = 12;        // 360 帧 @30fps
  const GROW_FAST = 1.0;     // 满时每秒 +1
  const GROW_SLOW = 0.31;    // 空时每秒 +0.31

  const padX = () => Math.max(26, W * 0.085);
  const padTop = () => Math.max(78, H * 0.085);
  const padBottom = () => Math.max(118, H * 0.14);
  const PX = (c) => [padX() + c.x * (W - padX() * 2), padTop() + c.y * (H - padTop() - padBottom())];
  const RAD = (c) => Math.min(c.r * Math.min(W, H) * 1.05, Math.min(W, H) * 0.13);

  function reset() {
    cells = MAP.map((m, i) => ({
      id:i, x:m.x, y:m.y, own:m.own, u:m.u, type:m.type, r:m.r,
      fat:-1, antibody:false, load:0, timer:0
    }));
    units = []; selected.clear(); over = 0; aiTimer = 0;
    document.getElementById('msg').style.display = 'none';
    document.getElementById('hint').style.opacity = 1;
    setTimeout(() => document.getElementById('hint').style.opacity = 0, 8000);
    syncHud();
  }

  function syncHud() {
    let p = 0, e = 0;
    for (const c of cells) { if (c.own === 1) p += Math.floor(c.u); else if (c.own === 2) e += Math.floor(c.u); }
    document.getElementById('pCount').textContent = p;
    document.getElementById('eCount').textContent = e;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  function cellAt(x, y) {
    for (let i = cells.length - 1; i >= 0; i--) {
      const c = cells[i], [cx, cy] = PX(c);
      if (Math.hypot(x - cx, y - cy) <= RAD(c) + 8) return c;
    }
    return null;
  }

  function inPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  cv.addEventListener('pointerdown', (ev) => {
    if (over) return;
    cv.setPointerCapture(ev.pointerId);
    const p = pos(ev);
    drag = { x0:p.x, y0:p.y, x1:p.x, y1:p.y, type: ev.pointerType === 'touch' ? 'lasso' : 'box', path:[p] };
  });

  cv.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const p = pos(ev);
    drag.x1 = p.x; drag.y1 = p.y;
    if (drag.type === 'lasso') {
      const last = drag.path[drag.path.length - 1];
      if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 8) drag.path.push(p);
    }
  });

  cv.addEventListener('pointerup', (ev) => {
    if (!drag) return;
    const d = drag; drag = null;
    const dist = Math.hypot(d.x1 - d.x0, d.y1 - d.y0);
    const p = pos(ev);

    if (dist < 10) {
      const c = cellAt(p.x, p.y);
      if (!c) { selected.clear(); return; }
      if (selected.size && c.own !== 1) { sendFleet(c); return; }
      if (c.own === 1 && c.type === 'n') { selected = new Set([c.id]); }
      else selected.clear();
      return;
    }

    const picked = new Set();
    const rx0 = Math.min(d.x0, d.x1), rx1 = Math.max(d.x0, d.x1);
    const ry0 = Math.min(d.y0, d.y1), ry1 = Math.max(d.y0, d.y1);
    for (const c of cells) {
      if (c.own !== 1 || c.type !== 'n') continue;
      const [cx, cy] = PX(c);
      if (d.type === 'lasso') { if (inPoly(cx, cy, d.path)) picked.add(c.id); }
      else if (cx >= rx0 && cx <= rx1 && cy >= ry0 && cy <= ry1) picked.add(c.id);
    }
    selected = picked;
  });

  cv.addEventListener('contextmenu', e => e.preventDefault());

  function sendFleet(target) {
    if (!selected.size) return;
    let moved = false;
    for (const id of selected) {
      const c = cells[id];
      if (!c || c.own !== 1 || c.type !== 'n' || c.u < 4) continue;
      const n = Math.floor(c.u * 0.5);
      if (n < 2) continue;
      c.u -= n;
      const [ax, ay] = PX(c), [bx, by] = PX(target);
      const dist = Math.hypot(bx - ax, by - ay);
      units.push({ kind:'w', side:1, n, target:target.id, x:ax, y:ay, sx:ax, sy:ay, tx:bx, ty:by,
        t:0, dur: Math.max(0.9, dist / (TRAVEL * speedMul)) });
      moved = true;
    }
    if (moved) selected.clear();
  }

  // 普通兵到达：抗体细胞吸收，其余按点扣血
  function arriveWhite(cell, side, n) {
    if (cell.own === side) { cell.u = Math.min(POWER_MAX, cell.u + n); return; }
    let left = n;
    if (cell.antibody) {
      cell.u = Math.min(POWER_MAX, cell.u + left);   // 抗体把攻击转成自身能量
      return;
    }
    cell.u -= left;
    if (cell.u < 0) { cell.own = side; cell.u = -cell.u; cell.antibody = false; cell.fat = -1; }
  }

  function arriveFat(cell, side) {
    if (cell.antibody && cell.fat === -1 && side !== cell.own) { cell.antibody = false; }
    else if (cell.fat === -1) { cell.fat = side; }
    else if (cell.fat !== side) { cell.fat = -1; }
  }

  function arriveAb(cell, side) {
    if (cell.fat === -1 || cell.fat === side) {
      cell.antibody = true;
      if (side !== cell.own) { cell.own = side; }
    }
  }

  function aiThink(dt) {
    aiTimer -= dt;
    if (aiTimer > 0) return;
    aiTimer = 1.1;
    const mine = cells.filter(c => c.own === 2 && c.type === 'n' && c.u >= 12);
    if (!mine.length) return;
    mine.sort((a, b) => b.u - a.u);
    const src = mine[0];
    let best = null, bd = 1e9;
    for (const c of cells) {
      if (c.own === 2) continue;
      const d = Math.hypot(c.x - src.x, c.y - src.y);
      if (d < bd) { bd = d; best = c; }
    }
    if (!best) return;
    if (src.u > best.u * 1.15 + 4) {
      const n = Math.floor(src.u * 0.5);
      if (n < 2) return;
      src.u -= n;
      const [ax, ay] = PX(src), [bx, by] = PX(best);
      units.push({ kind:'w', side:2, n, target:best.id, x:ax, y:ay, sx:ax, sy:ay, tx:bx, ty:by, t:0,
        dur: Math.max(0.9, Math.hypot(bx - ax, by - ay) / (TRAVEL * speedMul)) });
    }
  }

  function spawnSpecial(cell) {
    let best = null, bd = 1e9;
    const [ax, ay] = PX(cell);
    for (const c of cells) {
      if (c.id === cell.id || c.own === cell.own) continue;
      const [bx, by] = PX(c);
      const d = Math.hypot(bx - ax, by - ay);
      if (d < bd) { bd = d; best = c; }
    }
    if (!best) return;
    const [bx, by] = PX(best);
    units.push({ kind: cell.type === 'f' ? 'f' : 'a', side: cell.own, n: 1, target: best.id,
      x: ax, y: ay, sx: ax, sy: ay, tx: bx, ty: by, t: 0,
      dur: Math.max(1.2, bd / (TRAVEL * speedMul)) });
  }

  function checkEnd() {
    const p = cells.some(c => c.own === 1), e = cells.some(c => c.own === 2);
    if (!e) finish(1); else if (!p) finish(2);
  }

  function finish(who) {
    over = who;
    document.getElementById('mtitle').textContent = who === 1 ? '赢了' : '输了';
    document.getElementById('msub').textContent = who === 1 ? '所有细胞都归你了' : 'AI 占了全图，再来一局';
    document.getElementById('msg').style.display = 'grid';
  }

  let last = performance.now();
  function loop(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    const dt = raw * speedMul;
    last = now;
    if (!over) {
      for (const c of cells) {
        if (c.own === 0) continue;
        if (c.type === 'n') {
          // 越满产得越快：3.2s → 1.0s 一个
          const k = 1 - Math.min(1, c.u / POWER_MAX);
          const rate = GROW_FAST - (GROW_FAST - GROW_SLOW) * k;
          c.u = Math.min(POWER_MAX, c.u + rate * dt);
        } else if (c.u >= POWER_MAX) {
          c.timer += dt;
          if (c.timer >= (c.type === 'f' ? FAT_LOAD : AB_LOAD)) { c.timer = 0; c.u = 0; spawnSpecial(c); }
        }
      }
      for (const f of units) {
        f.t += dt / f.dur;
        const k = Math.min(1, f.t);
        f.x = f.sx + (f.tx - f.sx) * k;
        f.y = f.sy + (f.ty - f.sy) * k;
      }
      const done = units.filter(f => f.t >= 1);
      if (done.length) {
        units = units.filter(f => f.t < 1);
        for (const f of done) {
          const c = cells[f.target];
          if (!c) continue;
          if (f.kind === 'w') arriveWhite(c, f.side, f.n);
          else if (f.kind === 'f') arriveFat(c, f.side);
          else arriveAb(c, f.side);
        }
      }
      aiThink(dt); checkEnd(); syncHud();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,160,255,.05)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    ctx.strokeStyle = 'rgba(150,170,210,.10)';
    for (let i = 0; i < cells.length; i++) for (let j = i + 1; j < cells.length; j++) {
      const a = PX(cells[i]), b = PX(cells[j]);
      if (Math.hypot(a[0]-b[0], a[1]-b[1]) < Math.min(W,H)*0.42) {
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }

    for (const c of cells) {
      const [x, y] = PX(c), R = RAD(c);
      const col = c.own === 1 ? '#3b82f6' : c.own === 2 ? '#ef4444' : '#8b93a7';
      const grad = ctx.createRadialGradient(x, y, R*0.2, x, y, R);
      grad.addColorStop(0, col + 'cc'); grad.addColorStop(1, col + '33');
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
      ctx.lineWidth = selected.has(c.id) ? 4 : 2;
      ctx.strokeStyle = selected.has(c.id) ? '#fbbf24' : col;
      ctx.stroke();

      if (c.type === 'n') {
        ctx.fillStyle = '#f1f5fb'; ctx.font = `600 ${Math.max(13, R*0.58)}px -apple-system,"PingFang SC",sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.floor(c.u), x, y);
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
        ctx.beginPath();
        if (c.type === 'f') { ctx.arc(x, y, R*0.58, 0, Math.PI*2); ctx.arc(x, y, R*0.34, 0, Math.PI*2); }
        else {
          const sp = 8, ro = R*0.66, ri = R*0.44;
          for (let i = 0; i < sp*2; i++) {
            const ang = Math.PI/sp*i - Math.PI/2, rad = i % 2 ? ri : ro;
            const px = x + Math.cos(ang)*rad, py = y + Math.sin(ang)*rad;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath();
        }
        ctx.stroke();
        // 充能环
        if (c.u > 0) {
          ctx.beginPath();
          ctx.arc(x, y, R*0.95, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1, c.u/POWER_MAX));
          ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
        }
      }

      if (c.fat !== -1) {
        ctx.beginPath(); ctx.arc(x, y, R + 6, 0, Math.PI*2);
        ctx.strokeStyle = c.fat === 1 ? '#f59e0b' : '#fb923c'; ctx.lineWidth = 4; ctx.stroke();
      }
      if (c.antibody) {
        ctx.beginPath(); ctx.arc(x, y, R + 12, 0, Math.PI*2);
        ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
      }
    }

    for (const f of units) {
      const col = f.side === 1 ? '#60a5fa' : '#f87171';
      ctx.beginPath();
      if (f.kind === 'w') ctx.arc(f.x, f.y, 7, 0, Math.PI*2);
      else if (f.kind === 'f') ctx.arc(f.x, f.y, 10, 0, Math.PI*2);
      else { ctx.arc(f.x, f.y, 9, 0, Math.PI*2); }
      ctx.fillStyle = col; ctx.fill();
      if (f.kind !== 'w') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '600 11px sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(f.kind === 'w' ? f.n : (f.kind === 'f' ? '脂' : '抗'), f.x, f.y - 14);
    }

    if (drag) {
      if (drag.type === 'box') {
        const x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
        const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
        ctx.fillStyle = 'rgba(96,165,250,.12)'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(96,165,250,.7)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
      } else if (drag.path.length > 2) {
        ctx.beginPath(); ctx.moveTo(drag.path[0].x, drag.path[0].y);
        for (const p of drag.path) ctx.lineTo(p.x, p.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(96,165,250,.12)'; ctx.fill();
        ctx.strokeStyle = 'rgba(96,165,250,.7)'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  }

  document.getElementById('restart').onclick = reset;
  document.getElementById('again').onclick = reset;
  document.getElementById('speed').onclick = (e) => {
    speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
    e.target.textContent = '速度 x' + speedMul;
  };

  resize(); reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
