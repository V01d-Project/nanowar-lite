<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>细胞战争 Lite</title>
<link rel="stylesheet" href="src/style.css">
<script defer src="src/core.js"></script>
<script defer src="src/ai.js"></script>
<script defer src="src/render.js"></script>
<script defer src="src/input.js"></script>
<script defer src="src/app.js"></script>
</head>
<body>
<main id="wrap"><canvas id="c" aria-label="细胞战争战场：选择蓝色普通细胞，点击目标派出一半兵力"></canvas></main>
<header class="hud"><div class="pill">你 <b id="pCount">60</b></div><div class="pill" id="tip">圈选 · 派兵 50%</div><div class="pill">AI <b id="eCount">60</b></div></header>
<div class="hint">点选 / 圈选蓝色普通细胞 → 点目标派兵<br>特殊细胞只能充能 · 消灭敌方普通细胞获胜</div>
<div class="legend"><span>青环：充能</span><span>金环：发射倒计时</span></div>
<nav class="bottom"><button id="restart">重开</button><button id="speed">速度 x1</button></nav>
<div id="msg" role="dialog" aria-modal="true" aria-labelledby="mtitle" hidden><div class="card"><h1 id="mtitle"></h1><p id="msub"></p><button id="again">再来一局</button></div></div>
</body>
</html>
